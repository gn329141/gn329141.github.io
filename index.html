<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>金紙費用計算</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        /* 全面加大輸入框字體 */
        input[type="number"], textarea, input[type="text"] {
            font-size: 20px !important;
        }
        /* 隱藏數字輸入框的箭頭 */
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        body {
            overscroll-behavior-y: none; /* 防止下拉刷新效果 */
            padding-bottom: 160px; /* 底部空間加大以容納更大的總計欄 */
        }
        .tap-highlight-transparent {
            -webkit-tap-highlight-color: transparent;
        }
        /* 身分切換按鈕樣式 - 亮燈效果優化 */
        .role-btn {
            background-color: transparent;
            color: #fca5a5;
            border: 1px solid transparent;
            opacity: 0.7;
            transition: all 0.3s ease;
        }
        .role-btn.active {
            background-color: #dc2626;
            color: #fffbeb;
            border: 1px solid #fbbf24;
            box-shadow: 0 0 10px rgba(251, 191, 36, 0.6), inset 0 0 5px rgba(255, 255, 255, 0.2);
            font-weight: bold;
            opacity: 1;
            text-shadow: 0 1px 2px rgba(0,0,0,0.3);
            transform: scale(1.05);
        }
    </style>
</head>
<body class="bg-stone-100 text-stone-800 font-sans text-lg">

    <header class="bg-red-800 text-yellow-50 p-4 sticky top-0 z-50 shadow-md">
        <div class="flex justify-between items-center max-w-2xl mx-auto">
            <h1 class="text-2xl font-bold tracking-wider flex items-center">
                <i class="fa-solid fa-scroll mr-2"></i>
                <span>金紙費用計算</span>
            </h1>
            
            <!-- 身分切換區 -->
            <div class="flex bg-black/20 rounded-lg p-1 space-x-1 shadow-inner border border-red-900/30">
                <button onclick="switchRole('gong_sheng')" id="role-gong-sheng" class="role-btn active px-3 py-1 rounded text-base">
                    宮生
                </button>
                <button onclick="switchRole('believer')" id="role-believer" class="role-btn px-3 py-1 rounded text-base">
                    信者
                </button>
            </div>
        </div>
        
        <!-- 快速組合按鈕 -->
        <div id="combo-btn-container" class="mt-3 max-w-2xl mx-auto grid grid-cols-3 gap-2 transition-all duration-300">
            <button onclick="applyCombo('all')" id="btn-all" class="bg-yellow-100 text-stone-800 font-bold py-2 px-1 rounded-lg border border-yellow-600 shadow-sm text-base active:bg-yellow-200 transition">
                自選金紙
            </button>
            <button onclick="applyCombo('A')" id="btn-A" class="bg-stone-200 text-stone-600 font-bold py-2 px-1 rounded-lg border border-stone-300 shadow-sm text-base active:bg-red-700 active:text-white transition">
                A:祝壽組合($800)
            </button>
            <button onclick="applyCombo('B')" id="btn-B" class="bg-stone-200 text-stone-600 font-bold py-2 px-1 rounded-lg border border-stone-300 shadow-sm text-base active:bg-red-700 active:text-white transition">
                B:祝壽組合($600)
            </button>
        </div>
    </header>

    <main class="p-2 max-w-2xl mx-auto" id="productList">
        <!-- JS 將會在這裡渲染列表 -->
    </main>

    <!-- 備註欄位 -->
    <section class="max-w-2xl mx-auto px-2 mb-4">
        <div class="bg-white p-3 rounded-xl shadow-sm border border-stone-300">
            <label for="remarks" class="block text-xl font-bold text-stone-700 mb-2">
                <i class="fa-solid fa-pen-to-square mr-1"></i> 備註說明
            </label>
            <textarea id="remarks" rows="2" placeholder="請輸入備註事項..." 
                class="w-full p-2 bg-stone-50 border border-stone-300 rounded-lg text-stone-800 focus:outline-none focus:ring-2 focus:ring-yellow-500 resize-none transition-shadow text-lg"></textarea>
        </div>
    </section>

    <footer class="fixed bottom-0 left-0 right-0 bg-white border-t border-stone-300 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.1)] z-40">
        <div class="max-w-2xl mx-auto p-4">
            <div class="flex justify-between items-end mb-3">
                <div class="text-lg text-stone-600">總數量: <span id="totalQty" class="font-bold text-stone-900 text-2xl">0</span></div>
                <div class="text-right">
                    <div class="text-sm text-stone-500 mb-1">總金額</div>
                    <div class="text-4xl font-bold text-red-700 leading-none">$<span id="totalPrice">0</span></div>
                </div>
            </div>
            
            <div class="grid grid-cols-2 gap-4">
                <button onclick="showConfirmModal()" class="bg-stone-200 hover:bg-stone-300 text-stone-700 font-bold py-3 px-4 rounded-xl transition tap-highlight-transparent flex items-center justify-center text-xl">
                    <i class="fa-solid fa-rotate-left mr-2"></i> 清除
                </button>
                <button onclick="copySummary()" class="bg-yellow-600 hover:bg-yellow-700 text-white font-bold py-3 px-4 rounded-xl shadow transition tap-highlight-transparent flex items-center justify-center text-xl">
                    <i class="fa-solid fa-copy mr-2"></i> 複製明細
                </button>
            </div>
        </div>
    </footer>

    <!-- 共用提示框 (取代 alert) -->
    <div id="toast" class="fixed top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 bg-black/80 text-white px-8 py-6 rounded-2xl shadow-2xl transition-opacity duration-300 opacity-0 pointer-events-none z-[60] flex flex-col items-center min-w-[200px]">
        <i id="toastIcon" class="fa-solid fa-check-circle text-5xl text-green-400 mb-3"></i>
        <span id="toastMsg" class="font-bold text-2xl text-center">已複製</span>
    </div>

    <!-- 自訂確認清除視窗 (取代 confirm) -->
    <div id="confirmModal" class="fixed inset-0 bg-black/50 z-[70] hidden flex items-center justify-center opacity-0 transition-opacity duration-200">
        <div class="bg-white rounded-2xl p-6 m-4 max-w-sm w-full shadow-2xl transform scale-95 transition-transform duration-200" id="confirmBox">
            <h3 class="text-2xl font-bold text-stone-900 mb-2 flex items-center">
                <i class="fa-solid fa-triangle-exclamation text-red-500 mr-2"></i> 確認清除
            </h3>
            <p class="text-stone-600 text-lg mb-6">確定要清除所有已選數量與備註嗎？</p>
            <div class="flex space-x-3">
                <button onclick="closeConfirmModal()" class="flex-1 py-3 bg-stone-200 text-stone-700 rounded-xl font-bold text-lg active:bg-stone-300 transition">取消</button>
                <button onclick="executeReset()" class="flex-1 py-3 bg-red-600 text-white rounded-xl font-bold text-lg active:bg-red-700 transition">確定清除</button>
            </div>
        </div>
    </div>

    <script>
        // 定義宮生資料
        const productsDataGongSheng = [
            { name: "太極金", price: 30 }, { name: "天尺金", price: 20 }, { name: "大壽金", price: 65 },
            { name: "壽金", price: 40 }, { name: "二五金", price: 25 }, { name: "大福金", price: 25 },
            { name: "天庫", price: 30 }, { name: "地庫", price: 30 }, { name: "水府", price: 30 },
            { name: "補運錢", price: 55 }, { name: "改厄", price: 35 }, { name: "小往生", price: 55 },
            { name: "銀紙", price: 30 }, { name: "更衣", price: 35 }, { name: "本命錢", price: 35 },
            { name: "花仔錢", price: 40 }, { name: "地府錢", price: 35 }, { name: "燭2號", price: 180 },
            { name: "庫錢", price: 20 }, { name: "十二元神金", price: 35 }, { name: "白虎錢", price: 35 },
            { name: "甲馬", price: 35 }, { name: "神馬", price: 35 }, { name: "將軍錢", price: 35 },
            { name: "過關錢", price: 35 }, { name: "路關錢", price: 35 }, { name: "蓮花金", price: 40 },
            { name: "蓮花銀", price: 40 }, { name: "壽生蓮花座", price: 120 }, { name: "壽生花朵", price: 60 },
            { name: "往生蓮花座", price: 120 }, { name: "往生花朵", price: 60 },
            { name: "五路財神金", price: 80 }, { name: "土地公金", price: 80 }
        ];

        // 定義信者資料
        const productsDataBeliever = [
            { name: "太極金", price: 35 }, { name: "天尺金", price: 25 }, { name: "大壽金", price: 70 },
            { name: "壽金", price: 45 }, { name: "二五金", price: 30 }, { name: "大福金", price: 30 },
            { name: "天府", price: 35 }, { name: "地庫", price: 35 }, { name: "水庫", price: 35 },
            { name: "補運錢", price: 60 }, { name: "改厄", price: 40 }, { name: "小往生", price: 60 },
            { name: "銀紙", price: 35 }, { name: "更衣", price: 40 }, { name: "本命錢", price: 40 },
            { name: "花仔錢", price: 45 }, { name: "地府錢", price: 40 }, { name: "燭2號", price: 220 },
            { name: "庫錢", price: 25 }, { name: "十二元神金", price: 40 }, { name: "白虎錢", price: 40 },
            { name: "甲馬", price: 40 }, { name: "神馬", price: 40 }, { name: "將軍錢", price: 40 },
            { name: "過關錢", price: 40 }, { name: "路關錢", price: 40 }, { name: "蓮花金", price: 45 },
            { name: "蓮花銀", price: 45 }, { name: "壽生蓮花座", price: 150 }, { name: "壽生花朵", price: 80 },
            { name: "往生花朵座", price: 150 }, { name: "往生花朵", price: 80 },
            { name: "五路財神金", price: 85 }, { name: "土地公金", price: 85 }, { name: "燭3號", price: 150 }
        ];

        const combos = {
            'A': {
                "太極金": 1, "天尺金": 2, "大壽金": 1, "壽金": 1, "二五金": 1, "大福金": 1,
                "補運錢": 1, "花仔錢": 1, "十二元神金": 1, "甲馬": 1, "神馬": 1, "將軍錢": 1,
                "五路財神金": 1, "土地公金": 1, "燭2號": 1
            },
            'B': {
                "太極金": 1, "天尺金": 1, "大壽金": 1, "壽金": 1, "二五金": 1, "大福金": 1,
                "補運錢": 1, "五路財神金": 1, "土地公金": 1, "燭2號": 1
            }
        };

        // 初始化狀態 - 新增 decimalMode 追蹤該項目是否開啟小數功能
        let currentRole = 'gong_sheng'; 
        let items = productsDataGongSheng.map(p => ({ ...p, qty: 0, decimalMode: false }));
        let currentFilterMode = 'all'; 

        const productListEl = document.getElementById('productList');
        const totalPriceEl = document.getElementById('totalPrice');
        const totalQtyEl = document.getElementById('totalQty');
        const remarksEl = document.getElementById('remarks');

        function switchRole(role) {
            if (currentRole === role) return;

            const btnContainer = document.getElementById('combo-btn-container');
            const btnA = document.getElementById('btn-A');
            const btnB = document.getElementById('btn-B');
            const btnAll = document.getElementById('btn-all');

            if (role === 'believer') {
                btnA.style.display = 'none';
                btnB.style.display = 'none';
                btnContainer.classList.remove('grid-cols-3');
                btnContainer.classList.add('grid-cols-1');
                btnAll.innerText = "信者自選金紙";
                applyCombo('all');
            } else {
                btnA.style.display = ''; 
                btnB.style.display = '';
                btnContainer.classList.remove('grid-cols-1');
                btnContainer.classList.add('grid-cols-3');
                btnAll.innerText = "自選金紙";
            }

            // 記錄目前數量與小數點設定，以供切換身分後保留
            const currentQtyMap = {};
            items.forEach(item => {
                if (item.qty > 0 || item.decimalMode) {
                    currentQtyMap[item.name] = { qty: item.qty, decimalMode: item.decimalMode };
                }
            });

            currentRole = role;
            const newDataTemplate = role === 'believer' ? productsDataBeliever : productsDataGongSheng;

            items = newDataTemplate.map(p => {
                const preserved = currentQtyMap[p.name] || { qty: 0, decimalMode: false };
                return { ...p, qty: preserved.qty, decimalMode: preserved.decimalMode };
            });

            document.getElementById('role-gong-sheng').className = `role-btn ${role === 'gong_sheng' ? 'active' : ''} px-3 py-1 rounded text-base`;
            document.getElementById('role-believer').className = `role-btn ${role === 'believer' ? 'active' : ''} px-3 py-1 rounded text-base`;

            renderList();
        }

        function applyCombo(mode) {
            currentFilterMode = mode;
            updateButtonStyles(mode);

            // 切換組合時重置數量與小數點設定
            items.forEach(item => {
                item.qty = 0;
                item.decimalMode = false;
            });

            if (mode !== 'all') {
                const comboDef = combos[mode];
                for (const [name, qty] of Object.entries(comboDef)) {
                    const item = items.find(i => i.name === name);
                    if (item) item.qty = qty;
                }
            }
            renderList();
        }

        function updateButtonStyles(activeMode) {
            const btnAll = document.getElementById('btn-all');
            const btnA = document.getElementById('btn-A');
            const btnB = document.getElementById('btn-B');

            const inactiveClass = "bg-stone-200 text-stone-600 border-stone-300";
            const activeClass = "bg-red-700 text-white border-red-800 ring-2 ring-yellow-400";
            const allActiveClass = "bg-yellow-500 text-white border-yellow-600 ring-2 ring-white";

            btnAll.className = `font-bold py-2 px-1 rounded-lg border shadow-sm text-base transition ${activeMode === 'all' ? allActiveClass : 'bg-yellow-100 text-stone-800 border-yellow-600'}`;
            btnA.className = `font-bold py-2 px-1 rounded-lg border shadow-sm text-base transition ${activeMode === 'A' ? activeClass : inactiveClass}`;
            btnB.className = `font-bold py-2 px-1 rounded-lg border shadow-sm text-base transition ${activeMode === 'B' ? activeClass : inactiveClass}`;
        }

        function toggleDecimalMode(index) {
            items[index].decimalMode = !items[index].decimalMode;
            // 關閉小數點功能時，自動將當前數量四捨五入為整數，避免隱藏的浮點數殘留
            if (!items[index].decimalMode) {
                items[index].qty = Math.round(items[index].qty);
            }
            renderList();
        }

        function renderList() {
            productListEl.innerHTML = "";
            let displayItems = [];

            if (currentFilterMode !== 'all') {
                const comboDef = combos[currentFilterMode];
                displayItems = Object.keys(comboDef)
                    .map(name => items.find(item => item.name === name))
                    .filter(item => item); 
            } else {
                displayItems = items;
            }

            if (displayItems.length === 0) {
                productListEl.innerHTML = `
                    <div class="text-center text-stone-400 py-12">
                        <i class="fa-solid fa-box-open text-5xl mb-4"></i>
                        <p class="text-xl">找不到相關金紙</p>
                    </div>`;
                updateSummary();
                return;
            }

            displayItems.forEach((item) => {
                const realIndex = items.findIndex(i => i.name === item.name);
                const subtotal = Math.round(item.price * item.qty * 10) / 10;
                
                const card = document.createElement('div');
                card.className = `bg-white p-3 rounded-xl shadow-sm border-l-8 ${item.qty > 0 ? 'border-yellow-500 ring-1 ring-yellow-500/50' : 'border-stone-300'} mb-3 flex items-center justify-between transition-all duration-200`;
                
                card.innerHTML = `
                    <div class="flex-1">
                        <div class="text-2xl font-bold text-stone-900 mb-1">${item.name}</div>
                        <div class="text-stone-500 text-lg">單價: $${item.price}</div>
                    </div>
                    
                    <div class="flex flex-col items-end w-40">
                        <div class="flex items-center space-x-2 bg-stone-100 rounded-xl p-1 w-full justify-between">
                            <button onclick="updateQty(${realIndex}, -1)" class="w-11 h-11 flex-shrink-0 flex items-center justify-center bg-white border border-stone-300 rounded-lg text-red-600 active:bg-stone-200 tap-highlight-transparent shadow-sm">
                                <i class="fa-solid fa-minus text-xl"></i>
                            </button>
                            <input type="number" value="${item.qty}" step="${item.decimalMode ? '0.1' : '1'}" onchange="manualInput(${realIndex}, this.value)" class="w-full text-center bg-transparent font-bold text-2xl focus:outline-none p-0 text-stone-800" inputmode="decimal">
                            <button onclick="updateQty(${realIndex}, 1)" class="w-11 h-11 flex-shrink-0 flex items-center justify-center bg-red-700 text-white rounded-lg active:bg-red-800 tap-highlight-transparent shadow-sm">
                                <i class="fa-solid fa-plus text-xl"></i>
                            </button>
                        </div>
                        
                        <div class="flex justify-between items-center w-full mt-2">
                            <!-- 小數點切換開關 -->
                            <button onclick="toggleDecimalMode(${realIndex})" class="flex items-center justify-center space-x-1 text-sm px-2 py-1 rounded-md transition-colors tap-highlight-transparent ${item.decimalMode ? 'bg-blue-100 text-blue-700 font-bold border border-blue-300' : 'bg-stone-100 text-stone-400 border border-stone-200'}">
                                <i class="fa-solid ${item.decimalMode ? 'fa-toggle-on text-base' : 'fa-toggle-off text-base'}"></i>
                                <span>0.1</span>
                            </button>
                            <div class="text-lg font-bold ${item.qty > 0 ? 'text-red-700' : 'text-transparent'}">
                                小計: $${subtotal.toLocaleString()}
                            </div>
                        </div>
                    </div>
                `;
                productListEl.appendChild(card);
            });
            updateSummary();
        }

        function updateQty(index, change) {
            // 根據是否開啟小數點模式決定增減幅度 (0.1 或 1)
            const step = items[index].decimalMode ? 0.1 : 1;
            let newQty = items[index].qty + (change * step);
            
            // 處理 JS 浮點數精度問題 (例如 0.1 + 0.2 變成 0.30000004)
            newQty = Math.round(newQty * 10) / 10;
            
            if (newQty >= 0) {
                items[index].qty = newQty;
                renderList();
            }
        }

        function manualInput(index, value) {
            let val = parseFloat(value);
            if (isNaN(val) || val < 0) val = 0;

            // 若未開啟小數模式，強制將輸入值轉為整數
            if (!items[index].decimalMode) {
                val = Math.round(val);
            }

            // 確保只保留一位小數
            items[index].qty = Math.round(val * 10) / 10;
            renderList();
        }

        function updateSummary() {
            let total = 0;
            let qty = 0;
            items.forEach(item => {
                total += item.price * item.qty;
                qty += item.qty;
            });
            
            // 避免出現過長小數
            total = Math.round(total * 10) / 10;
            qty = Math.round(qty * 10) / 10;

            totalPriceEl.innerText = total.toLocaleString();
            totalQtyEl.innerText = qty;
        }

        // -- 自訂 Modal 邏輯 (取代 confirm) --
        function showConfirmModal() {
            const modal = document.getElementById('confirmModal');
            const box = document.getElementById('confirmBox');
            modal.classList.remove('hidden');
            // 延遲一點點以觸發 CSS 動畫
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                box.classList.remove('scale-95');
                box.classList.add('scale-100');
            }, 10);
        }

        function closeConfirmModal() {
            const modal = document.getElementById('confirmModal');
            const box = document.getElementById('confirmBox');
            modal.classList.add('opacity-0');
            box.classList.remove('scale-100');
            box.classList.add('scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 200);
        }

        function executeReset() {
            closeConfirmModal();
            items.forEach(item => {
                item.qty = 0;
                item.decimalMode = false;
            });
            remarksEl.value = ""; 
            applyCombo('all'); 
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // -- 自訂 Toast 邏輯 (取代 alert) --
        function showCustomToast(message, type = 'success') {
            const toastEl = document.getElementById('toast');
            const toastIcon = document.getElementById('toastIcon');
            const toastMsg = document.getElementById('toastMsg');

            toastMsg.innerText = message;
            if (type === 'error') {
                toastIcon.className = "fa-solid fa-circle-exclamation text-5xl text-red-400 mb-3";
            } else {
                toastIcon.className = "fa-solid fa-check-circle text-5xl text-green-400 mb-3";
            }

            toastEl.classList.remove('opacity-0');
            setTimeout(() => {
                toastEl.classList.add('opacity-0');
            }, 2000);
        }

        // 複製明細
        function copySummary() {
            const selectedItems = items.filter(i => i.qty > 0);
            if (selectedItems.length === 0) {
                showCustomToast("尚未選擇任何項目", "error");
                return;
            }

            let text = "【金紙費用明細】\n";
            text += `身分: ${currentRole === 'gong_sheng' ? '宮生' : '信者'}\n`;

            if (currentRole === 'gong_sheng') {
                 if (currentFilterMode === 'A') text += "(A:祝壽組合)\n";
                 if (currentFilterMode === 'B') text += "(B:祝壽組合)\n";
            }

            let total = 0;
            selectedItems.forEach(item => {
                // 修正小計的浮點數顯示
                const subtotal = Math.round(item.price * item.qty * 10) / 10;
                total += subtotal;
                text += `${item.name}: ${item.qty} x $${item.price} = $${subtotal}\n`;
            });
            text += "----------------\n";
            
            total = Math.round(total * 10) / 10;
            text += `總金額: $${total}\n`;
            
            const remarks = remarksEl.value.trim();
            if (remarks) {
                text += `備註: ${remarks}\n`;
            }

            text += `時間: ${new Date().toLocaleString('zh-TW', {hour12: false, month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit'})}`;

            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text)
                    .then(() => showCustomToast("已複製", "success"))
                    .catch(err => fallbackCopy(text));
            } else {
                fallbackCopy(text);
            }
        }

        function fallbackCopy(text) {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            // 將 textarea 移出畫面避免影響排版
            textArea.style.position = 'fixed';
            textArea.style.top = '-9999px';
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            try {
                document.execCommand('copy');
                showCustomToast("已複製", "success");
            } catch (err) {
                showCustomToast("複製失敗，請手動截圖", "error");
            }
            document.body.removeChild(textArea);
        }

        // 初始渲染
        renderList();

    </script>
</body>
</html>
